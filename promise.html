<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //promise means: i am doing some work now. i will give you the result later. if the work is done successfully then i will give you the result otherwise i will give you error.

        //for eg: caaling an api, fetching data from server reading a file, database operation, waiting for timer

        //total 3 states:
        //1. pending : initial state, before the promise succed or fails
        //2. fulfilled : the operation completed successfully.
        //3. rejected : the operation failed

        //creating promise:
        //syntax: 
        //let promise = new Promise(function(resolve,reject){
        // statements });
    </script>

    <script>
        //example 1
        let promise = new Promise(function(resolve, reject){
            let success = true;

            if(success)
        {
            resolve("operation successfully");
        }
        else{
            reject("operation reject");
        }
        });
    </script>

    <script>
        //example2
        function login(username, password)
        {
            return new Promise(function(resolve,reject)
            {
                if(username === "admin" && password === "1234")
            {
                resolve("Login successfully");
            }
            else
            {
                reject("Invalid password or username");
            }
            });
        }
        login("admin","1234")
        .then(function(result)
    {
        console.log(result);
    })
    .catch(function(error)
    {
        console.log(error);
    })
    </script>

    <script>
        //creating a promise using prompt - user input
        let promise2 = new Promise(function(resolve, reject){
            let username = prompt("Enter username:");
            let password = prompt("Enter password");

                if(username === "admin" && password === "1234")
            {
                resolve("Login successfully");
            }
            else
            {
                reject("Invalid password or username");
            }
            });
            promise2
            .then(msg => 
            {
                document.write("<h2 style='color:green'>"+msg+"</h2>");
            })
            .catch(err => 
            {
                document.write(`<h2 style='color:red'> ${err} </h2>`);
            })
            .finally(() => {
                document.write(`<p style='color:blue'> Login Attempt successfully</p>`);
            })
    </script>

    <script>
        //example3
        let promise3 = new Promise((resolve, reject) => 
        {
            console.log("Fetching data......");

            setTimeout(()=>
            {
                let dataAvailable = false;
                if(dataAvailable)
                {
                    resolve("Data Received from server...successfully");
                }
                else
                {
                    reject("Server Error...Something went wrong")
                }
            },5000);
        })
        promise3
        .then(res => console.log(res))
        .catch(err => console.log(err))
        .finally(() => console.log("Request process complete..."));
     </script>
</body>
</html>
