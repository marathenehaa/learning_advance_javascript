<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //example1
        var arr1 = [100, 200, 300];
        console.log(arr1);
        console.log(...arr1);
        console.log([arr1]);

    </script>

    <script>
        //example2
        var array1 = [10,20,30];
        var array2 = [40, 50, 60, 70, 80];
        //var array3 = array1.concat(array2);
        //var array3 = (...array1,...array2);

        array1.push(35);
        var array3 = [5, ...array1, ...array2, 90];

        document.write(array3);
    </script>

    <script>
        //example3
        var obj1 = {
            name: "Sonal",
            education: "IT",
        };
        var obj2 = {
            age: 21,
            phone: 1234567890,
        };
        var obj3 = {...obj1,...obj2};
        console.log(obj3);
        document.write(obj3);
        document.write(JSON.stringify(obj3));
        document.write(`<pre>${JSON.stringify(obj3,null,4)}</pre>`);
        //JSON.stringyfy(value, replacer, space);
        document.write(`<pre>${JSON.stringify(obj3,["name","age"],4)}</pre>`);
    </script>

    <script>
        //example4
        function sumRest(name,...args)//rest operator used in declaring
        {
            document.write(`Hello ${name} :`);
            let sum = 0;
            for(let i in args)
        {
            sum += args[i];
        }
        document.write(sum + "<br>");
        }
        var array4 = [10, 20, 30, 40];
        sumRest("Neha",...array4); //while function spread operator

        //The spread operator (...) its allow us to expand or unpack th elements of and array or properties of an object into individual values
    </script>

</body>
</html>
