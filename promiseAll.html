<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //promise1
        let p1 = new Promise((resolve) => 
        {
            setTimeout(() => resolve("Apple ready"),3000);
        });
        //promise2
        let p2 = new Promise((resolve) => 
        {
            setTimeout(() => resolve("Banana ready"),3000);
        });
        //promise3
        let p3 = new Promise((resolve) =>
        {
            setTimeout(() => resolve("Grapes ready"),3000)
        });

        Promise.all([p1,p2,p3])
        .then(result => 
        {
            document.write(`<h3> All fruits are ready</h3>`);
            result.forEach(item => document.write(`${item} <br>`));
        })
        .catch((error) => 
        {
            document.write("<h3 style='color:red'>One or more promise failed</h3>",
            );
        });
    </script>

    <script>
        function getStudentData()
        {
            //create a new promise
            return new Promise((resolve,reject) =>
            {
                //API call using setTimeOut()
                setTimeout(() => 
                //student APi successfully
                resolve("Student: Neha Marathe (Id : 101)"),3000);
            });
        }

        function getCourseData()
        {
            return new Promise((resolve,reject) =>
        {
            setTimeout(() => resolve("Course: Information technology"),3000);
        });
        }

        function getAttendanceData()
        {
            return new Promise((resolve,reject) => 
        {
            setTimeout(() => resolve("Attendance: 85% "),3000);
        });
        }

        Promise.all([getStudentData(), getCourseData(), getAttendanceData()])
        .then((result) => 
        {
            document.write(`<h3>Academic Dashboard Loaded successfully</h3>`);
            result.forEach(item => document.write(`${item} <br>`));
        })
        .catch((error) => 
        {
            document.write("<h3 style='color:red'>Failed to load academic data. Please try again </h3>");
        });
    </script>
</body>
</html>
