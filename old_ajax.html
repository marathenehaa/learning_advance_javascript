<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Load Local Data</h2>
    <button onclick="loadText()">Load Text File</button>
    <button onclick="loadJSON()">Load JSON File</button>

    <pre id="ajaxData">Click button to Load Data</pre>

    <script>
        function loadText()
        {
            var xhr = new XMLHttpRequest(); //create new ajax request object
            xhr.open("GET","file.txt",true);
            //GET: type of request
            //file.txt: file to load
            //true: make the requesr asynchronous (non blocking)
            xhr.onload = function()
            {
                if(xhr.status === 200)
            {
                document.getElementById("ajaxData").textContent = xhr.responseText;
            }
            else
            {
                document.getElementById("ajxData").textContent = "Error loading text file";
            }
            };

            xhr.onerror = function()
            {
                document.getElementById("ajaxData").textContent = "Request Failed";
            };
            xhr.send();
        }

        function loadJSON()
        {
            var xhr = new XMLHttpRequest(); 
            xhr.open("GET","data.json",true);

            xhr.onload = function()
            {
                if(xhr.status === 200)
            {
                var data = JSON.parse(xhr.responseText);
                document.getElementById("ajaxData").textContent = JSON.stringify(data, null, 4);
            }
            else
            {
                document.getElementById("ajxData").textContent = "Error loading text file";
            }
            };
            
            xhr.onerror = function()
            {
                document.getElementById("ajaxData").textContent = "Request Failed";
            };
            xhr.send();
        }
    
    </script>
</body>
</html>
