<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        class Hello
        {
            message()
            {
                document.write("Hello my name is neha" + "<br>");
            }
            helloWorld()
            {
                document.write("Welcome to Pune" + "<br><hr>");
            }
        }
        let a = new Hello();
        a.message();
        a.helloWorld();

        let b = new Hello();
        b.message();
        b.helloWorld();
    </script>

    <script>
        class student{
            display(name, course)
            {
                console.log(`Name : ${name}`);
                console.log(`Course : ${course}`);
            }
        }
        let student1 =  new student();
        student1.display("Ananya","CS");

        let student2 =  new student();
        student2.display("Neha","IT");
    </script>

    <script>
        //constructor method
        class student11{
            constructor(){
                document.write(`Hello constructor call directly <br><br><hr>`); 
            }
        }
        let s = new student11();
    </script>

    <script>
        //constructor with parameter
        //constructor is a special method inside a class that is automatically called when we create object
        class person
        {
            constructor(name, age)
            {
                this.p_name = name;//assign value to the objects property
                this.p_age = age;//referes to the current object being created
                this.display();//methods called inside constructor
            }
            display()
            {
                document.write(`Name : ${this.p_name}, Age : ${this.p_age} <br>`);
            }
        }
        const s1 = new person("Rutuja", 21);//contructor call ed automatically
        const s2 = new person("Aniket", 25);
        const s3 = new person("Nilesh", 23);
        // s1.display();
        // s2.display();
    </script>

    <script>
        //static method
        class student101
        {
            constructor(name, course)
            {
                this.name = name;
                this.course = course;
                this.display();
            }
            display()
            {
                console.log(`Name : ${this.name}`);
                console.log(`Course : ${this.course}`);
            }
            //static method
            static collegeName()
            {
                console.log("PCCOE");
            }
        }
        let student_s = new student101("Aniket","IT");
        student_s.display();

        //calling static method using classname - class.staticmethod name
        //static method belongs only to that class
        student101.collegeName();
    </script>

</body>
</html>
